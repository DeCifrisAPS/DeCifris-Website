<h1>DICONO DI NOI</h1>
<p>
    Articoli, registrazioni e segnalazioni esterne sulle attività di De Cifris.
</p>

<div *ngFor="let articolo of articoli" class="card-container">

    <mat-card class="notizia">
        <mat-card-header>
            <mat-card-title>{{ articolo.title }}</mat-card-title>
            <mat-card-subtitle>{{ articolo.subtitle }}</mat-card-subtitle>
        </mat-card-header>
        <div *ngIf="articolo.image" class="img-container">
            <img mat-card-image [src]="articolo.image" [alt]="articolo.imageAlt ?? ('Immagine di ' + articolo.title)" class="card-img-right">
        </div>
        <mat-card-content>
            {{ articolo.content }}
        </mat-card-content>
        <mat-card-actions>
            <a mat-button class="news-btn" [href]="articolo.link" target="_blank" rel="noopener"
                [attr.aria-label]="'Vai alla fonte: ' + articolo.title">Vai alla fonte</a>
        </mat-card-actions>
    </mat-card>
</div>
