<nav class="navbar navbar-expand-lg navbar-light fixed-top" aria-label="Main navigation">
    <a class="logo-container" routerLink="/">
        <img class="toolbar-logo" src="/assets/images/icons/decifris.svg" alt="De Cifris, home">
    </a>
    <button #navigationToggle class="navbar-toggler" type="button"
        (click)="sidebar.toggle(navigationToggle)" aria-label="Main navigation"
        [attr.aria-expanded]="sidebar.open()"
        [attr.aria-controls]="sidebar.hasSection() ? 'section-sidebar' : 'navbarSupportedContent'">
        <mat-icon aria-hidden="true">menu</mat-icon>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent"
        [class.mobile-menu-open]="sidebar.open() && !sidebar.hasSection()">
        <ul class="navbar-nav">
            @for (section of navigation; track section.path) {
                <li class="nav-item dropdown">
                    <a class="nav-link" [routerLink]="section.path" (click)="closeDropdown()">{{ section.label }}</a>
                    @if (section.links.length) {
                        <button #toggle type="button" class="menu-toggle"
                            [attr.aria-label]="section.label" [attr.aria-expanded]="openDropdown === section.path"
                            [attr.aria-controls]="'menu-' + $index" (click)="toggleDropdown(section.path, toggle)">
                            <span aria-hidden="true">▾</span>
                        </button>
                        <ul class="dropdown-menu" [id]="'menu-' + $index" [class.show]="openDropdown === section.path">
                            @for (link of section.links; track link.path) {
                                <li><a class="dropdown-item" [routerLink]="link.path" (click)="closeDropdown()">{{ link.label }}</a></li>
                            }
                        </ul>
                    }
                </li>
            }
        </ul>
        <ul class="navbar-nav navbar-contacts">
            @for (link of contacts; track link.path) {
                <li><a class="nav-link" [routerLink]="link.path" (click)="closeDropdown()">{{ link.label }}</a></li>
            }
        </ul>
    </div>
</nav>
